name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26.3"
  GOFUMPT_VERSION: "v0.9.2"
  GOLANGCI_LINT_VERSION: "v2.11.3"
  GOVULNCHECK_VERSION: "v1.1.4"

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install gofumpt
        run: go install mvdan.cc/gofumpt@${{ env.GOFUMPT_VERSION }}

      - name: Build
        run: go build ./...

      - name: Format check (gofumpt)
        run: test -z "$(gofumpt -l .)"

      # Covers: go vet, staticcheck, gosec, goimports, errcheck, ineffassign, unused
      # Config: .golangci.yml
      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9.2.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          install-only: true

      - name: Show enabled linters
        run: golangci-lint linters | grep '^Enabled' -A 20

      - name: Lint
        run: golangci-lint run ./...

      - name: Test
        run: go test -race ./...

      - name: Vulnerability check
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }}
          govulncheck ./...

  check-source-branch:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate source branch
        run: |
          HEAD="${{ github.head_ref }}"
          if [[ "$HEAD" =~ ^release- || "$HEAD" =~ ^hotfix- ]]; then
            echo "OK: $HEAD is allowed to merge into main"
          else
            echo "REJECTED: $HEAD — main へは release-* か hotfix-* からのみマージ可能"
            exit 1
          fi
